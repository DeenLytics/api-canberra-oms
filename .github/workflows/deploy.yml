name: Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run php artisan migrate --force on the server'
        type: boolean
        default: false

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  REMOTE_PATH: /home/canberra-api/public_html
  # PHP-FPM serves this site from a per-user pool
  # (/etc/php/8.2/fpm/pool.d/…), so every file must be readable by this user.
  # rsync as root would otherwise stamp the runner's uid onto the tree.
  OWNER: canberra-api
  PHP_VERSION: '8.2'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, pdo_mysql, gd, zip
          coverage: none

      # Vendor is built here so the cPanel box never runs composer.
      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # No Node step here on purpose. package.json exists but carries only vite
      # and tailwind as devDependencies, there is no lockfile, and production
      # has never had node_modules or public/build — verified on the server.
      # This is an API; the sole @vite reference is in Laravel's default
      # welcome.blade.php. Building assets here added a failure mode and
      # nothing else: setup-node with `cache: npm` cannot resolve a lockfile
      # that does not exist, which is exactly how the first run died.

      # rsync excludes are the safety-critical part of this file.
      #
      #   .env               server-owned; holds DB and mail credentials
      #   storage/           app/public/products is 210 uploaded product images.
      #                      This is USER DATA and exists nowhere else — not in
      #                      Git, not in this artifact. --delete without this
      #                      exclude would erase every product photo.
      #   public/storage     `php artisan storage:link` symlink into storage/
      #   bootstrap/cache    regenerated below
      #   .htaccess          cPanel rewrites the PHP handler block; leave the
      #                      server's copy authoritative
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # This box also runs unrelated apps. Confirm the target exists before
      # --delete runs anywhere.
      - name: Preflight — confirm target
        run: |
          ssh -p ${{ secrets.SSH_PORT || 22 }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "test -f ${{ env.REMOTE_PATH }}/artisan || { echo 'not a Laravel root: ${{ env.REMOTE_PATH }}'; exit 1; }
             test -d ${{ env.REMOTE_PATH }}/storage/app/public/products || echo 'WARNING: product image dir not found'
             echo 'target ok'"
          # vendor/ is NOT excluded from --delete: CI builds it and ships it, so
          # the server never runs composer. That makes an incomplete vendor a
          # site-down event rather than a slow build. Refuse to rsync one.
          test -f vendor/autoload.php || { echo "::error::vendor/autoload.php missing — composer step did not produce a usable vendor"; exit 1; }
          n=$(find vendor -type f -name '*.php' | wc -l)
          echo "vendor: $n php files"
          [ "$n" -gt 1000 ] || { echo "::error::vendor looks truncated ($n php files) — refusing to rsync with --delete"; exit 1; }

      - name: Deploy
        run: |
          rsync -az --delete \
            --no-owner --no-group \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='storage/' \
            --exclude='public/storage' \
            --exclude='bootstrap/cache/' \
            --exclude='public/build' \
            --exclude='.htaccess' \
            --exclude='node_modules/' \
            -e "ssh -p ${{ secrets.SSH_PORT || 22 }}" \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.REMOTE_PATH }}/

      - name: Migrate
        if: github.event_name == 'workflow_dispatch' && inputs.run_migrations
        run: |
          ssh -p ${{ secrets.SSH_PORT || 22 }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ env.REMOTE_PATH }} && php artisan migrate --force"

      # Ownership first, then caches.
      #
      # bootstrap/cache is excluded from rsync so the runner's copy never
      # ships — but the server's own copy must be DELETED, not merely
      # regenerated. CI builds vendor with --no-dev, and a packages.php written
      # back when composer ran with dev dependencies still registers
      # Laravel\Pail's service provider. The app then cannot boot at all, which
      # means `artisan optimize:clear` cannot run either. Deleting the files
      # outright is the only thing that works from a broken state.
      - name: Fix ownership and rebuild caches
        run: |
          ssh -p ${{ secrets.SSH_PORT || 22 }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "set -e
             cd ${{ env.REMOTE_PATH }}
             chown -R ${{ env.OWNER }}:${{ env.OWNER }} ${{ env.REMOTE_PATH }}
             rm -f bootstrap/cache/packages.php bootstrap/cache/services.php bootstrap/cache/config.php bootstrap/cache/routes-*.php
             sudo -u ${{ env.OWNER }} php artisan package:discover
             sudo -u ${{ env.OWNER }} php artisan config:cache
             sudo -u ${{ env.OWNER }} php artisan route:cache
             sudo -u ${{ env.OWNER }} php artisan view:cache
             sudo -u ${{ env.OWNER }} php artisan storage:link 2>/dev/null || true
             sudo -u ${{ env.OWNER }} php artisan --version"

      # Two checks, in order, so a failure names the layer that broke:
      # /health boots the framework and nothing else; /site-setting additionally
      # reads the database. Health passing while site-setting fails points at
      # the database or config, not at the deploy.
      - name: Smoke test
        run: |
          base=https://canberra-api.deenlytics.com/api/v1
          h=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$base/health")
          echo "GET /health       -> $h"
          [ "$h" = "200" ] || { echo "::error::app did not boot after deploy (/health returned $h)"; exit 1; }
          s=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$base/site-setting")
          echo "GET /site-setting -> $s"
          [ "$s" = "200" ] || { echo "::error::app booted but /site-setting returned $s — check database and config"; exit 1; }
